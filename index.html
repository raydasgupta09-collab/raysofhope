<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art for Hope – Supporting Cancer Hospitals</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    color: #333;
}

header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 2rem 0;
    text-align: center;
}

header h1 { font-size: 2.5rem; }
header p { font-size: 1.2rem; }

nav {
    background: white;
    padding: 1rem 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
}

nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 2rem;
}

nav a {
    text-decoration: none;
    color: #333;
    padding: 0.5rem 1rem;
    border-radius: 5px;
}

nav a:hover {
    background: #667eea;
    color: white;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 2rem;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
}

.artwork-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.artwork-image {
    width: 100%;
    height: 500px;
    object-fit: cover;
    display: block;
}

.featured {
    max-width: 900px;
    margin: 0 auto 3rem;
    
/* Two artworks side by side beneath the alligator */
.top-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2rem;
    margin-bottom: 3rem;
}

.top-row .artwork-image {
    height: 400px;
    object-fit: cover;
}

@media (max-width: 768px) {
    .top-row {
        grid-template-columns: 1fr;
    }
}

.featured .artwork-image {
    height: auto;
    max-height: none;
    object-fit: contain;
}

.featured .artwork-title {
    font-size: 1.8rem;
    text-align: center;
}

.gallery .artwork-image {
    height: 400px;
}

.artwork-info {
    padding: 1.5rem;
}

.artwork-title {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
}

.artwork-price {
    font-size: 1.4rem;
    color: #667eea;
    font-weight: bold;
}

.order-btn {
    margin-top: 1rem;
    width: 100%;
    padding: 0.75rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.order-btn:hover { opacity: 0.9; }

footer {
    background: #333;
    color: white;
    text-align: center;
    padding: 2rem;
    margin-top: 3rem;
}

@media (max-width: 768px) {
    nav ul { gap: 1rem; flex-wrap: wrap; }
    .gallery { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
    <h1>🎨 Ray's Drawings</h1>
    <p>Art Portfolio</p>
</header>

<nav>
<ul>
    <li><a href="#gallery">Gallery</a></li>
    <li><a href="#contact">Contact</a></li>
</ul>
</nav>


<div class="container">

    <!-- Featured alligator at the top -->
    <div class="artwork-card featured">
        <img class="artwork-image"
             src="images/IMG_0104.jpeg"
             alt="An Alligator">
        <div class="artwork-info">
            <h3 class="artwork-title">Alligator on The Wall</h3>
        </div>
    </div>

    <!-- Birds Eye View and Deep Down side by side -->
    <div class="top-row">

        <div class="artwork-card">
            <img class="artwork-image"
                 src="images/IMG_9745 (1).jpeg"
                 alt="Birds Eye View">
            <div class="artwork-info">
                <h3 class="artwork-title">Birds Eye View</h3>
            </div>
        </div>

        <div class="artwork-card">
            <img class="artwork-image"
                 src="images/IMG_2280.jpg"
                 alt="Deep Down">
            <div class="artwork-info">
                <h3 class="artwork-title">Deep Down</h3>
            </div>
        </div>

    </div>

    <!-- Remaining artwork in the original three-column grid -->
    <div class="gallery">

        <div class="artwork-card">
            <img class="artwork-image" src="images/IMG_0120.jpeg" alt="Deep Static">
            <div class="artwork-info"><h3 class="artwork-title">Deep Static</h3></div>
        </div>

        <div class="artwork-card">
            <img class="artwork-image" src="images/1.png" alt="DB no T">
            <div class="artwork-info"><h3 class="artwork-title">DB no T *digital*</h3></div>
        </div>

        <div class="artwork-card">
            <img class="artwork-image" src="images/IMG_9688.jpeg" alt="Tool Loot">
            <div class="artwork-info"><h3 class="artwork-title">Tool Loot</h3></div>
        </div>

        <div class="artwork-card">
            <img class="artwork-image" src="images/IMG_9689.jpeg" alt="Blind Eyes">
            <div class="artwork-info"><h3 class="artwork-title">Blind Eyes</h3></div>
        </div>

        <div class="artwork-card">
            <img class="artwork-image" src="images/IMG_9690.jpeg" alt="Skulless Head">
            <div class="artwork-info"><h3 class="artwork-title">Skulless Head</h3></div>
        </div>

        <div class="artwork-card">
            <img class="artwork-image" src="images/IMG_9691.jpeg" alt="Windy City">
            <div class="artwork-info"><h3 class="artwork-title">Windy City</h3></div>
        </div>

        <div class="artwork-card">
            <img class="artwork-image" src="images/IMG_0106.jpeg" alt="Sharp Silvers">
            <div class="artwork-info"><h3 class="artwork-title">Sharp Silvers</h3></div>
        </div>

    </div>

</div>

</div>

</body>
</html>
